name: Fast workshop checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --locked --no-install-project

      - name: Verify required imports
        run: uv run --locked python test_environment.py

      - name: Validate notebooks without executing cells
        run: uv run --locked python scripts/ci/validate_notebooks.py

      - name: Validate Codex workflow safety invariants
        run: uv run --locked python scripts/ci/validate_agent_automation.py

      - name: Run small local data-contract tests
        run: uv run --locked python -m unittest discover -s tests -v
