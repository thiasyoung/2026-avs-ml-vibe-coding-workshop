name: Codex collaborator development

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

# Every job starts read-only. Only the branch, publisher, synchronization, and
# merge-preparation jobs receive the narrow write permission they need. Codex
# itself never receives a write-capable GitHub token.
permissions:
  contents: read
  issues: read
  pull-requests: read

# A collaborator's requests share one development branch, so queue that
# collaborator's full workflow. Different collaborators can run in parallel.
concurrency:
  group: codex-dev-${{ github.repository }}-${{ github.actor }}
  cancel-in-progress: false

env:
  DEFAULT_MAX_REQUEST_CHARS: "6000"
  DEFAULT_MAX_RUNS_PER_ISSUE: "6"

jobs:
  intake:
    name: Authorize and prepare Issue request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.intake.outputs.execute }}
      mode: ${{ steps.intake.outputs.mode }}
      issue_number: ${{ steps.intake.outputs.issue_number }}
      event_key: ${{ steps.intake.outputs.event_key }}
      branch: ${{ steps.intake.outputs.branch }}
      base_ref: ${{ steps.intake.outputs.base_ref }}
    steps:
      - name: Create the trusted workflow workspace
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate trigger, event identity, and spend limits
        id: intake
        uses: actions/github-script@v8
        env:
          CODEX_AGENT_ENABLED: ${{ vars.CODEX_AGENT_ENABLED || 'false' }}
          MAX_REQUEST_CHARS: ${{ vars.CODEX_MAX_REQUEST_CHARS || env.DEFAULT_MAX_REQUEST_CHARS }}
          MAX_RUNS_PER_ISSUE: ${{ vars.CODEX_MAX_RUNS_PER_ISSUE || env.DEFAULT_MAX_RUNS_PER_ISSUE }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            if (!workspace) throw new Error('GITHUB_WORKSPACE is not available.');
            const payload = context.payload;
            const issue = payload.issue;
            const isIssueComment = context.eventName === 'issue_comment';
            // GitHub event metadata, never text supplied in an Issue or comment.
            const actor = payload.sender?.login || '';
            const requestText = isIssueComment ? (payload.comment?.body || '') : (issue?.body || '');
            const marker = /(^|\s)@codex\b/i;
            const commandMatch = requestText.match(/@codex\s+(sync with main|prepare merge)\b/i);
            const command = commandMatch ? commandMatch[1].toLowerCase() : '';
            const mode = command === 'sync with main'
              ? 'sync'
              : command === 'prepare merge' ? 'prepare_merge' : 'develop';
            const issueNumber = issue?.number;
            const baseRef = payload.repository.default_branch;
            const branch = actor ? `dev/${actor}` : '';
            const eventKey = isIssueComment ? `comment-${payload.comment.id}` : `issue-${issue.id}-${issue.updated_at}`;
            const maxChars = Number.parseInt(process.env.MAX_REQUEST_CHARS, 10) || 6000;
            const maxRuns = Number.parseInt(process.env.MAX_RUNS_PER_ISSUE, 10) || 6;
            const stop = (reason) => {
              core.info(`Codex intake declined: ${reason}`);
              core.setOutput('execute', 'false');
              core.setOutput('mode', mode);
              core.setOutput('issue_number', String(issueNumber || ''));
              core.setOutput('event_key', eventKey || '');
              core.setOutput('branch', branch);
              core.setOutput('base_ref', baseRef || '');
            };
            if (!issueNumber) return stop('no Issue payload');
            if (isIssueComment && issue.pull_request) return stop('pull-request comments are not triggers');
            if (!marker.test(requestText)) return stop('no @codex marker in the triggering text');
            if (!/^[A-Za-z0-9-]+$/.test(actor)) return stop('invalid GitHub event actor');
            if (process.env.CODEX_AGENT_ENABLED.trim().toLowerCase() !== 'true') return stop('CODEX_AGENT_ENABLED is not true');
            if (requestText.length > maxChars) return stop(`request exceeds ${maxChars} characters`);
            let permission;
            try {
              permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: actor,
              });
            } catch (error) {
              return stop(`could not verify the triggering collaborator: ${error.status || error.message}`);
            }
            if (!new Set(['admin', 'maintain', 'write']).has(permission.data.user?.permissions)) {
              return stop('triggering account does not have repository write access');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            const botComments = comments.filter((comment) => comment.user?.login === 'github-actions[bot]');
            if (botComments.some((comment) => (comment.body || '').includes(`<!-- codex-agent-event:${eventKey} -->`))) {
              return stop('this event already completed');
            }
            if (botComments.filter((comment) => (comment.body || '').includes('<!-- codex-agent-event:')).length >= maxRuns) {
              return stop(`Issue has reached its ${maxRuns}-run cap`);
            }
            if (mode === 'develop') {
              const requestArtifactPath = path.join(workspace, 'codex-agent-request.json');
              const payloadForCodex = {
                issue: {
                  number: issueNumber,
                  title: (issue.title || '').slice(0, maxChars),
                  body: (issue.body || '').slice(0, maxChars),
                  url: issue.html_url,
                },
                triggering_request: requestText.slice(0, maxChars),
                trigger: isIssueComment ? 'issue_comment' : 'issue_body',
                requested_by: actor,
                branch,
              };
              fs.writeFileSync(requestArtifactPath, JSON.stringify(payloadForCodex, null, 2));
            }
            core.setOutput('execute', 'true');
            core.setOutput('mode', mode);
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('event_key', eventKey);
            core.setOutput('branch', branch);
            core.setOutput('base_ref', baseRef);

      - name: Confirm the request artifact exists
        if: steps.intake.outputs.execute == 'true' && steps.intake.outputs.mode == 'develop'
        shell: bash
        run: |
          if [[ ! -s "$GITHUB_WORKSPACE/codex-agent-request.json" ]]; then
            echo "::error::Expected request JSON was not created: $GITHUB_WORKSPACE/codex-agent-request.json"
            exit 1
          fi
          echo "Request JSON exists and is non-empty."

      - name: Upload sanitized request artifact
        if: steps.intake.outputs.execute == 'true' && steps.intake.outputs.mode == 'develop'
        uses: actions/upload-artifact@v6
        with:
          name: codex-request-${{ github.run_id }}
          path: ${{ github.workspace }}/codex-agent-request.json
          if-no-files-found: error
          retention-days: 1

  branch:
    name: Create or select collaborator development branch
    needs: intake
    if: needs.intake.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      branch_url: ${{ steps.branch.outputs.branch_url }}
    steps:
      - name: Create dev branch only when it does not exist
        id: branch
        uses: actions/github-script@v8
        env:
          DEV_BRANCH: ${{ needs.intake.outputs.branch }}
          BASE_REF: ${{ needs.intake.outputs.base_ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = process.env.DEV_BRANCH;
            const getBranch = () => github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}`,
            });
            try {
              await getBranch();
              core.info(`Reusing existing branch ${branch}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const base = await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${process.env.BASE_REF}`,
              });
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: `refs/heads/${branch}`, sha: base.data.object.sha,
                });
                core.info(`Created ${branch} from the current default-branch tip.`);
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await getBranch();
                core.info(`Reusing concurrently-created branch ${branch}.`);
              }
            }
            core.setOutput('branch_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${branch}`);

  codex:
    name: Inspect, edit, and draft a development patch
    needs: [intake, branch]
    if: needs.intake.outputs.execute == 'true' && needs.intake.outputs.mode == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Check out the collaborator development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.branch }}
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install UV and the locked workshop environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare the isolated environment before Codex starts
        run: uv sync --locked --no-install-project
      - name: Download the Issue request
        uses: actions/download-artifact@v6
        with:
          name: codex-request-${{ github.run_id }}
          path: .
      - name: Build a trusted prompt around the Issue data
        run: uv run --locked python .github/scripts/prepare_codex_prompt.py
      # This is the final step in this job. Codex has no GitHub write token.
      - name: Run Codex in the isolated workspace
        id: run_codex
        uses: openai/codex-action@v1
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: ${{ github.actor }}
          model: gpt-5.6-terra
          effort: xhigh
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .codex-agent-prompt.md
          output-schema-file: .github/codex/issue-result.schema.json

  publish:
    name: Validate and publish development patch
    needs: [intake, branch, codex]
    if: needs.intake.outputs.execute == 'true' && needs.intake.outputs.mode == 'develop' && needs.codex.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the collaborator development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.branch }}
          persist-credentials: false
      - name: Validate the structured result and write an allowed patch
        id: result
        uses: actions/github-script@v8
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            let result;
            try { result = JSON.parse(process.env.CODEX_FINAL_MESSAGE || ''); }
            catch (error) { throw new Error(`Codex did not return valid structured JSON: ${error.message}`); }
            if (!['patch', 'no_change'].includes(result.mode) || typeof result.summary !== 'string' ||
                !Array.isArray(result.tests) || typeof result.patch !== 'string') {
              throw new Error('Codex result does not match the expected contract.');
            }
            const protectedPath = (path) =>
              path === 'AGENTS.md' || path === '.gitignore' || path === 'docs/GITHUB_CODEX_AGENT.md' ||
              path === '.git' || path.startsWith('.git/') || path.startsWith('.github/');
            const paths = [...result.patch.matchAll(/^diff --git a\/(.+?) b\/(.+)$/gm)]
              .flatMap((match) => [match[1], match[2]]);
            if (result.mode === 'patch') {
              if (!result.patch.startsWith('diff --git ') || !paths.length) throw new Error('A patch result must contain a unified git diff.');
              if (paths.some(protectedPath)) throw new Error('Codex attempted to modify a protected path.');
              if (/^GIT binary patch$/m.test(result.patch) || /^new file mode 120000$/m.test(result.patch)) {
                throw new Error('Binary and symlink patches are not accepted.');
              }
              fs.writeFileSync('.codex-agent.patch', result.patch, 'utf8');
              core.setOutput('has_patch', 'true');
            } else {
              if (result.patch.trim()) throw new Error('A no_change result must not contain a patch.');
              core.setOutput('has_patch', 'false');
            }

      - name: Apply validated patch and push only the development branch
        id: push
        if: steps.result.outputs.has_patch == 'true'
        env:
          CODEX_BRANCH: ${{ needs.intake.outputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
        shell: bash
        run: |
          git switch "$CODEX_BRANCH" || git switch --track -c "$CODEX_BRANCH" "origin/$CODEX_BRANCH"
          if ! git apply --check --whitespace=error .codex-agent.patch || ! git apply --index --whitespace=error .codex-agent.patch; then
            echo "status=patch_conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "status=no_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "codex: address Issue #$ISSUE_NUMBER"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push origin "HEAD:refs/heads/$CODEX_BRANCH"; then
            echo "status=pushed" >> "$GITHUB_OUTPUT"
          else
            echo "status=push_rejected" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the outcome on the original Issue
        if: always() && steps.result.outcome == 'success'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
          EVENT_KEY: ${{ needs.intake.outputs.event_key }}
          BRANCH_URL: ${{ needs.branch.outputs.branch_url }}
          PUSH_STATUS: ${{ steps.push.outputs.status || 'no_change' }}
          CODEX_RESULT: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = JSON.parse(process.env.CODEX_RESULT);
            const clean = (text) => String(text).replace(/@/g, 'ï¼ ').slice(0, 4000);
            const status = process.env.PUSH_STATUS;
            const outcome = status === 'pushed'
              ? 'Committed the validated change to your development branch.'
              : status === 'patch_conflict' ? 'The patch no longer applied cleanly; no branch change was pushed.'
              : status === 'push_rejected' ? 'The branch changed while this request ran; no change was overwritten or pushed.'
              : 'Codex reported no committed change.';
            const body = [
              `<!-- codex-agent-event:${process.env.EVENT_KEY} -->`,
              '## Codex development result', '', `[Open your development branch](${process.env.BRANCH_URL})`, '', outcome, '',
              clean(result.summary), '', '### Lightweight checks reported by Codex',
              ...(result.tests.length ? result.tests.map((item) => `- ${clean(item)}`) : ['- Not reported']), '',
              'This workflow never pushes to the default branch or merges changes automatically.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER), body,
            });

  sync:
    name: Synchronize collaborator branch with main
    needs: [intake, branch]
    if: needs.intake.outputs.execute == 'true' && needs.intake.outputs.mode == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the collaborator development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.branch }}
          persist-credentials: true
      - name: Merge the current default branch without overwriting work
        id: merge
        env:
          CODEX_BRANCH: ${{ needs.intake.outputs.branch }}
          BASE_REF: ${{ needs.intake.outputs.base_ref }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit "origin/$BASE_REF"; then
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ', ' -)"
            git merge --abort || true
            echo "status=needs_review" >> "$GITHUB_OUTPUT"
            echo "details=${conflicts:-Git could not automatically resolve this merge.}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" == "$before" ]]; then
            echo "status=already_current" >> "$GITHUB_OUTPUT"
          elif git push origin "HEAD:refs/heads/$CODEX_BRANCH"; then
            echo "status=synchronized" >> "$GITHUB_OUTPUT"
          else
            echo "status=push_rejected" >> "$GITHUB_OUTPUT"
          fi
      - name: Report synchronization outcome
        if: always()
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
          EVENT_KEY: ${{ needs.intake.outputs.event_key }}
          BRANCH_URL: ${{ needs.branch.outputs.branch_url }}
          STATUS: ${{ steps.merge.outputs.status || 'failed' }}
          DETAILS: ${{ steps.merge.outputs.details }}
        with:
          github-token: ${{ github.token }}
          script: |
            const messages = {
              synchronized: 'Merged the latest `main` into your development branch.',
              already_current: 'Your development branch already contains the latest `main`.',
              needs_review: `Git found merge conflicts that need human review: ${process.env.DETAILS}`,
              push_rejected: 'The branch changed while synchronization ran; no change was overwritten.',
              failed: 'Synchronization did not complete. Review the workflow log before retrying.',
            };
            const body = [
              `<!-- codex-agent-event:${process.env.EVENT_KEY} -->`, '## Codex branch synchronization', '',
              `[Open your development branch](${process.env.BRANCH_URL})`, '', messages[process.env.STATUS] || messages.failed,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER), body,
            });

  prepare_merge:
    name: Test collaborator branch and prepare a pull request
    needs: [intake, branch]
    if: needs.intake.outputs.execute == 'true' && needs.intake.outputs.mode == 'prepare_merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the collaborator development branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.branch }}
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install UV and the locked workshop environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run the relevant lightweight checks
        id: tests
        shell: bash
        run: |
          status=0
          uv sync --locked --no-install-project || status=1
          uv run --locked python test_environment.py || status=1
          uv run --locked python scripts/ci/validate_notebooks.py || status=1
          uv run --locked python scripts/ci/validate_agent_automation.py || status=1
          uv run --locked python -m unittest discover -s tests -v || status=1
          if [[ "$status" == 0 ]]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update a pull request into main
        id: pull_request
        if: steps.tests.outputs.status == 'passed'
        uses: actions/github-script@v8
        env:
          CODEX_BRANCH: ${{ needs.intake.outputs.branch }}
          BASE_REF: ${{ needs.intake.outputs.base_ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const head = `${context.repo.owner}:${process.env.CODEX_BRANCH}`;
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', head,
              base: process.env.BASE_REF, per_page: 1,
            });
            const title = `Prepare ${process.env.CODEX_BRANCH} for merge`;
            const body = 'Prepared by the constrained Codex collaborator workflow. Review and merge manually.';
            const pull = existing.data.length
              ? (await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: existing.data[0].number, title, body })).data
              : (await github.rest.pulls.create({ owner: context.repo.owner, repo: context.repo.repo, title, head, base: process.env.BASE_REF, body })).data;
            core.setOutput('url', pull.html_url);
      - name: Report merge-preparation outcome
        if: always()
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
          EVENT_KEY: ${{ needs.intake.outputs.event_key }}
          BRANCH_URL: ${{ needs.branch.outputs.branch_url }}
          TEST_STATUS: ${{ steps.tests.outputs.status || 'failed' }}
          PULL_REQUEST_URL: ${{ steps.pull_request.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = process.env.TEST_STATUS === 'passed' && process.env.PULL_REQUEST_URL
              ? `[Open the pull request](${process.env.PULL_REQUEST_URL})`
              : 'The lightweight checks did not pass, so no pull request was created.';
            const body = [
              `<!-- codex-agent-event:${process.env.EVENT_KEY} -->`, '## Codex merge preparation', '',
              `[Open your development branch](${process.env.BRANCH_URL})`, '', result, '',
              'This workflow never merges automatically.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER), body,
            });
