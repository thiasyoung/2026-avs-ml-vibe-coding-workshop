name: Codex Issue-to-PR agent

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

# The default is read-only. Only the publisher job receives narrowly scoped
# write permissions, and it runs on a fresh runner after Codex has exited.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # This explicit identity is intentionally the only initial trigger authority.
  # Change it in a reviewed pull request to add another maintainer.
  INITIAL_ALLOWED_USER: thiasyoung
  DEFAULT_MAX_REQUEST_CHARS: "6000"
  DEFAULT_MAX_RUNS_PER_ISSUE: "6"

jobs:
  intake:
    name: Authorize and prepare Issue request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.intake.outputs.execute }}
      reason: ${{ steps.intake.outputs.reason }}
      issue_number: ${{ steps.intake.outputs.issue_number }}
      event_key: ${{ steps.intake.outputs.event_key }}
      branch: ${{ steps.intake.outputs.branch }}
      working_ref: ${{ steps.intake.outputs.working_ref }}
      base_ref: ${{ steps.intake.outputs.base_ref }}
    steps:
      - name: Validate trigger, identity, and spend limits
        id: intake
        uses: actions/github-script@v8
        env:
          CODEX_AGENT_ENABLED: ${{ vars.CODEX_AGENT_ENABLED || 'false' }}
          MAX_REQUEST_CHARS: ${{ vars.CODEX_MAX_REQUEST_CHARS || env.DEFAULT_MAX_REQUEST_CHARS }}
          MAX_RUNS_PER_ISSUE: ${{ vars.CODEX_MAX_RUNS_PER_ISSUE || env.DEFAULT_MAX_RUNS_PER_ISSUE }}
          INITIAL_ALLOWED_USER: ${{ env.INITIAL_ALLOWED_USER }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            if (!workspace) throw new Error('GITHUB_WORKSPACE is not available.');
            const payload = context.payload;
            const issue = payload.issue;
            const isIssueComment = context.eventName === 'issue_comment';
            const actor = payload.sender?.login || '';
            const requestText = isIssueComment ? (payload.comment?.body || '') : (issue?.body || '');
            const marker = /(^|\s)@codex\b/i;
            const issueNumber = issue?.number;
            const baseRef = payload.repository.default_branch;
            const branch = `codex/issue-${issueNumber}`;
            const eventKey = isIssueComment
              ? `comment-${payload.comment.id}`
              : `issue-${issue.id}-${issue.updated_at}`;
            const maxChars = Number.parseInt(process.env.MAX_REQUEST_CHARS, 10) || 6000;
            const maxRuns = Number.parseInt(process.env.MAX_RUNS_PER_ISSUE, 10) || 6;

            const stop = (reason) => {
              core.info(`Codex intake declined: ${reason}`);
              core.setOutput('execute', 'false');
              core.setOutput('reason', reason);
              core.setOutput('issue_number', String(issueNumber || ''));
              core.setOutput('event_key', eventKey || '');
              core.setOutput('branch', branch || '');
              core.setOutput('working_ref', baseRef || '');
              core.setOutput('base_ref', baseRef || '');
            };

            if (!issueNumber) return stop('no Issue payload');
            if (isIssueComment && issue.pull_request) return stop('pull-request comments are not triggers');
            if (!marker.test(requestText)) return stop('no @codex marker in the triggering text');
            if (actor.toLowerCase() !== process.env.INITIAL_ALLOWED_USER.toLowerCase()) {
              return stop('triggering account is not the initially authorized user');
            }
            if (process.env.CODEX_AGENT_ENABLED.trim().toLowerCase() !== 'true') {
              return stop('CODEX_AGENT_ENABLED is not true');
            }
            if (requestText.length > maxChars) return stop(`request exceeds ${maxChars} characters`);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const botComments = comments.filter((comment) => comment.user?.login === 'github-actions[bot]');
            if (botComments.some((comment) => (comment.body || '').includes(`<!-- codex-agent-event:${eventKey} -->`))) {
              return stop('this event already completed');
            }
            if (botComments.filter((comment) => (comment.body || '').includes('<!-- codex-agent-event:')).length >= maxRuns) {
              return stop(`Issue has reached its ${maxRuns}-run cap`);
            }

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              base: baseRef,
              per_page: 1,
            });
            const workingRef = pulls.data.length ? branch : baseRef;
            const payloadForCodex = {
              issue: {
                number: issueNumber,
                title: (issue.title || '').slice(0, maxChars),
                body: (issue.body || '').slice(0, maxChars),
                url: issue.html_url,
              },
              triggering_request: requestText.slice(0, maxChars),
              trigger: isIssueComment ? 'issue_comment' : 'issue_body',
              requested_by: actor,
            };
            const requestArtifactPath = path.join(
              workspace,
              '.codex-agent-request.json',
            );
            fs.writeFileSync(requestArtifactPath, JSON.stringify(payloadForCodex, null, 2));
            core.setOutput('execute', 'true');
            core.setOutput('reason', 'authorized request');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('event_key', eventKey);
            core.setOutput('branch', branch);
            core.setOutput('working_ref', workingRef);
            core.setOutput('base_ref', baseRef);

      - name: Upload sanitized request artifact
        if: steps.intake.outputs.execute == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-request-${{ github.run_id }}
          path: ${{ github.workspace }}/.codex-agent-request.json
          if-no-files-found: error
          retention-days: 1

  codex:
    name: Inspect, edit, and draft a patch
    needs: intake
    if: needs.intake.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Check out the existing feature branch or default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.working_ref }}
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install UV and the locked workshop environment
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare the isolated environment before Codex starts
        run: uv sync --locked --no-install-project

      - name: Download the Issue request
        uses: actions/download-artifact@v6
        with:
          name: codex-request-${{ github.run_id }}
          path: .

      - name: Build a trusted prompt around the Issue data
        run: uv run --locked python .github/scripts/prepare_codex_prompt.py

      # This intentionally is the final step in this job. Codex receives no
      # GitHub write token and returns only structured text to the new runner.
      - name: Run Codex in the isolated workspace
        id: run_codex
        uses: openai/codex-action@v1
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: thiasyoung
          model: gpt-5.6-terra
          effort: xhigh
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .codex-agent-prompt.md
          output-schema-file: .github/codex/issue-result.schema.json

  publish:
    name: Validate patch and propose pull request
    needs: [intake, codex]
    if: needs.intake.outputs.execute == 'true' && needs.codex.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the target feature branch or default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.intake.outputs.working_ref }}
          persist-credentials: false

      - name: Validate the structured result and write an allowed patch
        id: result
        uses: actions/github-script@v8
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const raw = process.env.CODEX_FINAL_MESSAGE || '';
            let result;
            try {
              result = JSON.parse(raw);
            } catch (error) {
              throw new Error(`Codex did not return valid structured JSON: ${error.message}`);
            }
            if (!['patch', 'no_change'].includes(result.mode) || typeof result.summary !== 'string' ||
                !Array.isArray(result.tests) || typeof result.patch !== 'string') {
              throw new Error('Codex result does not match the expected contract.');
            }
            const protectedPath = (path) =>
              path === 'AGENTS.md' || path === '.gitignore' || path === 'docs/GITHUB_CODEX_AGENT.md' ||
              path === '.git' || path.startsWith('.git/') || path.startsWith('.github/');
            const paths = [...result.patch.matchAll(/^diff --git a\/(.+?) b\/(.+)$/gm)]
              .flatMap((match) => [match[1], match[2]]);
            if (result.mode === 'patch') {
              if (!result.patch.startsWith('diff --git ') || paths.length === 0) {
                throw new Error('A patch result must contain a unified git diff.');
              }
              if (paths.some(protectedPath)) throw new Error('Codex attempted to modify a protected path.');
              if (/^GIT binary patch$/m.test(result.patch) || /^new file mode 120000$/m.test(result.patch)) {
                throw new Error('Binary and symlink patches are not accepted.');
              }
              fs.writeFileSync('.codex-agent.patch', result.patch, 'utf8');
              core.setOutput('has_patch', 'true');
            } else {
              if (result.patch.trim()) throw new Error('A no_change result must not contain a patch.');
              core.setOutput('has_patch', 'false');
            }
            fs.writeFileSync('.codex-agent-result.json', JSON.stringify(result, null, 2));

      - name: Apply validated patch and push only the feature branch
        if: steps.result.outputs.has_patch == 'true'
        env:
          CODEX_BRANCH: ${{ needs.intake.outputs.branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git switch -C "$CODEX_BRANCH"
          git apply --check --whitespace=error .codex-agent.patch
          git apply --index --whitespace=error .codex-agent.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "codex: address Issue #${{ needs.intake.outputs.issue_number }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$CODEX_BRANCH"

      - name: Create or update the pull request
        id: pull_request
        if: steps.result.outputs.has_patch == 'true'
        uses: actions/github-script@v8
        env:
          CODEX_BRANCH: ${{ needs.intake.outputs.branch }}
          BASE_REF: ${{ needs.intake.outputs.base_ref }}
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
          CODEX_RESULT: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = JSON.parse(process.env.CODEX_RESULT);
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const head = `${context.repo.owner}:${process.env.CODEX_BRANCH}`;
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              base: process.env.BASE_REF,
              per_page: 1,
            });
            const title = `Codex: Issue #${issueNumber}`;
            const body = [
              `Closes #${issueNumber}.`,
              '',
              'This change was proposed by the constrained Codex Issue workflow. Review before merging.',
              '',
              '## Summary',
              result.summary,
              '',
              '## Lightweight checks run by Codex',
              ...(result.tests.length ? result.tests.map((item) => `- ${item}`) : ['- Not reported']),
            ].join('\n');
            let pull;
            if (existing.data.length) {
              pull = (await github.rest.pulls.update({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: existing.data[0].number, title, body,
              })).data;
            } else {
              pull = (await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, head: process.env.CODEX_BRANCH, base: process.env.BASE_REF, body,
              })).data;
            }
            core.setOutput('url', pull.html_url);

      - name: Report the outcome on the original Issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ needs.intake.outputs.issue_number }}
          EVENT_KEY: ${{ needs.intake.outputs.event_key }}
          PULL_REQUEST_URL: ${{ steps.pull_request.outputs.url }}
          CODEX_RESULT: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = JSON.parse(process.env.CODEX_RESULT);
            const clean = (text) => String(text).replace(/@/g, '＠').slice(0, 4000);
            const link = process.env.PULL_REQUEST_URL
              ? `[Open the proposed pull request](${process.env.PULL_REQUEST_URL})`
              : 'No pull request was created because Codex reported no allowed change.';
            const body = [
              `<!-- codex-agent-event:${process.env.EVENT_KEY} -->`,
              '## Codex Issue agent result',
              '',
              link,
              '',
              clean(result.summary),
              '',
              '### Lightweight checks reported by Codex',
              ...(result.tests.length ? result.tests.map((item) => `- ${clean(item)}`) : ['- Not reported']),
              '',
              'This workflow never merges or pushes directly to the default branch. Review the pull request and its checks before merging.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
