name: Codex workshop runner

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

# Authorization is read-only. Only the job that publishes completed work
# receives repository write permission; Codex is not passed that write token.
permissions:
  contents: read
  issues: read

jobs:
  prepare:
    name: Authorize and prepare request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      run_codex: ${{ steps.request.outputs.run_codex }}
      issue_number: ${{ steps.request.outputs.issue_number }}
      branch: ${{ steps.request.outputs.branch }}
      command: ${{ steps.request.outputs.command }}
    steps:
      - name: Read repository metadata
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Authorize request for the shared main branch
        id: request
        uses: actions/github-script@v8
        env:
          CODEX_AGENT_ENABLED: ${{ vars.CODEX_AGENT_ENABLED || 'true' }}
        with:
          script: |
            const event = context.payload;
            const isComment = context.eventName === 'issue_comment';
            if (isComment && event.issue.pull_request) {
              core.setOutput('run_codex', 'false');
              return;
            }

            const text = isComment ? event.comment.body : event.issue.body;
            if (!/@codex\b/i.test(text || '')) {
              core.setOutput('run_codex', 'false');
              return;
            }
            if (process.env.CODEX_AGENT_ENABLED.toLowerCase() !== 'true') {
              core.warning('Codex Issue agent is disabled by CODEX_AGENT_ENABLED.');
              core.setOutput('run_codex', 'false');
              return;
            }

            // The sender comes from the GitHub event, never from Issue text.
            const actor = event.sender.login;
            if (event.sender.type !== 'User') {
              core.setOutput('run_codex', 'false');
              return;
            }
            const repository = await github.rest.repos.get(context.repo);
            const allowed = new Set(['admin', 'maintain', 'write']);
            // The repository owner is always trusted. GitHub's collaborator
            // endpoint can report a public-repository owner's role as `read`.
            const isOwner = actor.toLowerCase() === repository.data.owner.login.toLowerCase();
            let hasWriteAccess = isOwner;
            if (!hasWriteAccess) {
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              hasWriteAccess = allowed.has(permission.data.permission);
            }
            if (!hasWriteAccess) {
              core.warning(`Ignoring @codex from ${actor}: repository write access is required.`);
              core.setOutput('run_codex', 'false');
              return;
            }

            const branch = 'main';
            await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });

            const redactCredentials = (value) => String(value || '').replace(
              /\b(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g,
              '[REDACTED]',
            );
            // Legacy branch-management commands now validate main only.
            const command = /^@codex\s+(sync with main|prepare merge)\s*[.!]?\s*$/i.test(text.trim())
              ? 'validate_main' : 'development';
            const request = {
              issue_number: event.issue.number,
              issue_title: redactCredentials(event.issue.title),
              request: redactCredentials(text),
              actor,
              branch,
              event: context.eventName,
              command,
            };
            await require('fs').promises.writeFile(
              'codex-agent-request.json',
              JSON.stringify(request, null, 2) + '\n',
              { encoding: 'utf8', mode: 0o600 },
            );
            core.setOutput('run_codex', 'true');
            core.setOutput('issue_number', String(event.issue.number));
            core.setOutput('branch', branch);
            core.setOutput('command', command);

      - name: Verify request file
        if: steps.request.outputs.run_codex == 'true'
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/codex-agent-request.json" \
            || { echo "::error::Request JSON not created"; exit 1; }
          echo "Request file exists."

      - name: Upload request for isolated execution
        if: steps.request.outputs.run_codex == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-agent-request-${{ github.run_id }}
          path: codex-agent-request.json
          if-no-files-found: error
          retention-days: 1

  codex:
    name: Run Codex and update main
    needs: prepare
    if: needs.prepare.outputs.run_codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      # Only authorized requests reach this shared lock. Each starts from the
      # latest main after the preceding request has finished publishing.
      group: codex-workshop-${{ github.repository }}-main
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      CODEX_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the starting main revision
        id: start
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Create locked workshop environment
        run: uv sync --locked --no-install-project

      - name: Download request
        uses: actions/download-artifact@v7
        with:
          name: codex-agent-request-${{ github.run_id }}
          path: .codex-agent-handoff

      - name: Create Codex prompt
        run: >-
          uv run --no-sync python .github/scripts/prepare_codex_prompt.py
          --request .codex-agent-handoff/codex-agent-request.json
          --instructions .github/codex/issue-agent-instructions.md
          --output .codex-agent-prompt.md

      - name: Run Codex
        id: codex_run
        uses: openai/codex-action@v1
        env:
          # Codex receives its own API credential only.  The GitHub write token
          # is deliberately reserved for the publishing steps below.
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-terra
          effort: xhigh
          sandbox: danger-full-access
          prompt-file: .codex-agent-prompt.md
          output-schema-file: .github/codex/issue-result.schema.json

      - name: Commit completed workshop work to main
        id: publish
        if: success() && steps.codex_run.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          START_SHA: ${{ steps.start.outputs.sha }}
        run: |
          if [ "$CODEX_BRANCH" != main ] || [ "$(git branch --show-current)" != main ] \
             || [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            echo "::error::Checkout changed unexpectedly; refusing to publish."
            exit 1
          fi
          rm -f codex-agent-request.json .codex-agent-prompt.md
          rm -rf .codex-agent-handoff
          git add -A

          # Outputs are ignored in the repository by default.  Preserve useful
          # generated data, figures, and executed notebooks, but leave caches,
          # event logs, and very large trained-weight files on the runner.
          while IFS= read -r -d '' file; do
            git add -f -- "$file"
          done < <(
            find . -type f -path '*/outputs/*' \
              ! -path '*/trainer_logs/*' \
              ! -path '*/tensorboard/*' \
              ! -path '*/checkpoints/*' \
              ! -name '*.ckpt' ! -name '*.pt' ! -name '*.pth' \
              -size -50M -print0
          )

          if git diff --cached --quiet; then
            echo 'status=no_changes' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "codex: Issue #${ISSUE_NUMBER}"
          # Other runner requests share the main lock, but a person may still
          # push while Codex works. Never rebase untested changes or force-push.
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$CODEX_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$START_SHA" ]; then
            echo "::error::main changed during this run. Nothing was pushed; submit the request again to use the latest main."
            exit 1
          fi
          git push origin "HEAD:refs/heads/${CODEX_BRANCH}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'status=pushed' >> "$GITHUB_OUTPUT"

      - name: Report result on Issue
        if: always()
        uses: actions/github-script@v8
        env:
          STATUS: ${{ steps.publish.outputs.status || 'failed' }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha || '' }}
          RAW_RESULT: ${{ steps.codex_run.outputs.final-message || '' }}
        with:
          script: |
            const status = process.env.STATUS;
            const branch = process.env.BRANCH;
            let result = {};
            try { result = JSON.parse(process.env.RAW_RESULT); } catch (_) {}
            const summary = status === 'failed'
              ? 'The request was not published to main. Check the workflow log for a run error, a newer main revision, or a branch-protection rejection. Retry the request after resolving the cause.'
              : result.summary || (status === 'pushed'
              ? 'Codex completed the requested work and committed the changes.'
              : status === 'no_changes'
                ? 'Codex completed its run but did not produce repository changes.'
                : 'The Codex run did not finish cleanly. Open the workflow log for details.');
            const tests = Array.isArray(result.tests) && result.tests.length
              ? `\n\nChecks:\n${result.tests.map(test => `- ${test}`).join('\n')}`
              : '';
            const branchUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${branch}`;
            const commit = process.env.COMMIT_SHA
              ? `\n\nCommit: https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.COMMIT_SHA}`
              : '';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `## Codex workshop runner\n\n${summary}${tests}\n\nShared branch: [${branch}](${branchUrl})${commit}\n\nStatus: **${status}**`,
            });
