name: Codex workshop runner

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

# The workflow-level token is read-only.  Only the job that publishes the
# completed work receives repository write permission.
permissions:
  contents: read
  issues: read

concurrency:
  # Requests for one person's development branch are serialized; different
  # collaborators can work at the same time.
  group: codex-workshop-${{ github.repository }}-${{ github.actor }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Authorize and prepare request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    outputs:
      run_codex: ${{ steps.request.outputs.run_codex }}
      issue_number: ${{ steps.request.outputs.issue_number }}
      branch: ${{ steps.request.outputs.branch }}
      base_branch: ${{ steps.request.outputs.base_branch }}
      command: ${{ steps.request.outputs.command }}
    steps:
      - name: Read repository metadata
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authorize request and create development branch
        id: request
        uses: actions/github-script@v8
        env:
          CODEX_AGENT_ENABLED: ${{ vars.CODEX_AGENT_ENABLED || 'true' }}
        with:
          script: |
            const event = context.payload;
            const isComment = context.eventName === 'issue_comment';
            if (isComment && event.issue.pull_request) {
              core.setOutput('run_codex', 'false');
              return;
            }

            const text = isComment ? event.comment.body : event.issue.body;
            if (!/@codex\b/i.test(text || '')) {
              core.setOutput('run_codex', 'false');
              return;
            }
            if (process.env.CODEX_AGENT_ENABLED.toLowerCase() !== 'true') {
              core.warning('Codex Issue agent is disabled by CODEX_AGENT_ENABLED.');
              core.setOutput('run_codex', 'false');
              return;
            }

            // The sender comes from the GitHub event, never from Issue text.
            const actor = event.sender.login;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(permission.data.user.permission)) {
              core.warning(`Ignoring @codex from ${actor}: repository write access is required.`);
              core.setOutput('run_codex', 'false');
              return;
            }

            const repository = await github.rest.repos.get(context.repo);
            const base = repository.data.default_branch;
            const branch = `dev/${actor}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const source = await github.rest.git.getRef({ ...context.repo, ref: `heads/${base}` });
              try {
                await github.rest.git.createRef({
                  ...context.repo,
                  ref: `refs/heads/${branch}`,
                  sha: source.data.object.sha,
                });
              } catch (createError) {
                // A simultaneous request may have created it; in that case reuse it.
                if (createError.status !== 422) throw createError;
              }
            }

            const redactCredentials = (value) => String(value || '').replace(
              /\b(?:sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g,
              '[REDACTED]',
            );
            const normalized = text.trim().toLowerCase();
            const command = normalized.includes('@codex sync with main')
              ? 'sync_with_main'
              : normalized.includes('@codex prepare merge') ? 'prepare_merge' : 'development';
            const request = {
              issue_number: event.issue.number,
              issue_title: redactCredentials(event.issue.title),
              request: redactCredentials(text),
              actor,
              branch,
              base_branch: base,
              event: context.eventName,
              command,
            };
            await require('fs').promises.writeFile(
              'codex-agent-request.json',
              JSON.stringify(request, null, 2) + '\n',
              { encoding: 'utf8', mode: 0o600 },
            );
            core.setOutput('run_codex', 'true');
            core.setOutput('issue_number', String(event.issue.number));
            core.setOutput('branch', branch);
            core.setOutput('base_branch', base);
            core.setOutput('command', command);

      - name: Verify request file
        if: steps.request.outputs.run_codex == 'true'
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/codex-agent-request.json" \
            || { echo "::error::Request JSON not created"; exit 1; }
          echo "Request file exists."

      - name: Upload request for isolated execution
        if: steps.request.outputs.run_codex == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-agent-request-${{ github.run_id }}
          path: codex-agent-request.json
          if-no-files-found: error
          retention-days: 1

  codex:
    name: Run Codex and publish development work
    needs: prepare
    if: needs.prepare.outputs.run_codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      CODEX_BRANCH: ${{ needs.prepare.outputs.branch }}
      BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
      CODEX_COMMAND: ${{ needs.prepare.outputs.command }}
    steps:
      - name: Check out the requester's development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Create locked workshop environment
        run: uv sync --locked --no-install-project

      - name: Bring development branch up to date with main
        if: needs.prepare.outputs.command == 'sync_with_main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${BASE_BRANCH}"
          # Leave straightforward conflicts for Codex to resolve in this
          # disposable checkout; the publishing step makes the single commit.
          git merge --no-commit --no-ff "origin/${BASE_BRANCH}" || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Download request
        uses: actions/download-artifact@v7
        with:
          name: codex-agent-request-${{ github.run_id }}
          path: .codex-agent-handoff

      - name: Create Codex prompt
        run: >-
          uv run --no-sync python .github/scripts/prepare_codex_prompt.py
          --request .codex-agent-handoff/codex-agent-request.json
          --instructions .github/codex/issue-agent-instructions.md
          --output .codex-agent-prompt.md

      - name: Run Codex
        id: codex_run
        uses: openai/codex-action@v1
        env:
          # Codex receives its own API credential only.  The GitHub write token
          # is deliberately reserved for the publishing steps below.
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-terra
          effort: xhigh
          sandbox: danger-full-access
          prompt-file: .codex-agent-prompt.md
          output-schema-file: .github/codex/issue-result.schema.json

      - name: Commit completed workshop work
        id: publish
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f codex-agent-request.json .codex-agent-prompt.md
          rm -rf .codex-agent-handoff
          git add -A

          # Outputs are ignored in the repository by default.  Preserve useful
          # generated data, figures, and executed notebooks, but leave caches,
          # event logs, and very large trained-weight files on the runner.
          while IFS= read -r -d '' file; do
            git add -f -- "$file"
          done < <(
            find . -type f -path '*/outputs/*' \
              ! -path '*/trainer_logs/*' \
              ! -path '*/tensorboard/*' \
              ! -path '*/checkpoints/*' \
              ! -name '*.ckpt' ! -name '*.pt' ! -name '*.pth' \
              -size -50M -print0
          )

          if git diff --cached --quiet; then
            echo 'status=no_changes' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "codex: Issue #${ISSUE_NUMBER}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${CODEX_BRANCH}"
          echo 'status=pushed' >> "$GITHUB_OUTPUT"

      - name: Create merge pull request on request
        id: merge_pr
        if: always() && needs.prepare.outputs.command == 'prepare_merge' && (steps.publish.outputs.status == 'pushed' || steps.publish.outputs.status == 'no_changes')
        uses: actions/github-script@v8
        with:
          script: |
            const openPulls = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${process.env.CODEX_BRANCH}`,
              base: process.env.BASE_BRANCH,
              per_page: 1,
            });
            const pull = openPulls.data[0] || (await github.rest.pulls.create({
              ...context.repo,
              title: `Workshop updates from ${process.env.CODEX_BRANCH}`,
              head: process.env.CODEX_BRANCH,
              base: process.env.BASE_BRANCH,
              body: `Prepared by Codex in response to Issue #${process.env.ISSUE_NUMBER}.`,
            })).data;
            core.setOutput('url', pull.html_url);

      - name: Report result on Issue
        if: always()
        uses: actions/github-script@v8
        env:
          STATUS: ${{ steps.publish.outputs.status || 'failed' }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          PR_URL: ${{ steps.merge_pr.outputs.url || '' }}
          RAW_RESULT: ${{ steps.codex_run.outputs.final-message || '' }}
        with:
          script: |
            const status = process.env.STATUS;
            const branch = process.env.BRANCH;
            let result = {};
            try { result = JSON.parse(process.env.RAW_RESULT); } catch (_) {}
            const summary = result.summary || (status === 'pushed'
              ? 'Codex completed the requested work and committed the changes.'
              : status === 'no_changes'
                ? 'Codex completed its run but did not produce repository changes.'
                : 'The Codex run did not finish cleanly. Open the workflow log for details.');
            const tests = Array.isArray(result.tests) && result.tests.length
              ? `\n\nChecks:\n${result.tests.map(test => `- ${test}`).join('\n')}`
              : '';
            const branchUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${branch}`;
            const pullRequest = process.env.PR_URL ? `\n\nMerge pull request: ${process.env.PR_URL}` : '';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `## Codex workshop runner\n\n${summary}${tests}\n\nDevelopment branch: [${branch}](${branchUrl})${pullRequest}\n\nStatus: **${status}**`,
            });
