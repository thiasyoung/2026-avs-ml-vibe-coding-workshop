website:
  title: "How to Use AI to Vibe Code and Build a Scientific Machine Learning Pipeline"
  description: "2026 AVS workshop: build a molecular prediction pipeline, improve IR data, and experiment with HTEM process-emulator models."
  site-url: https://thiasyoung.github.io/2026-avs-ml-vibe-coding-workshop/
  repo-url: https://github.com/thiasyoung/2026-avs-ml-vibe-coding-workshop
  repo-branch: main
  repo-actions: [source, issue]
  page-navigation: true
  reader-mode: true
  navbar:
    title: AVS ML Workshop
    left:
      - href: index.qmd
        text: Home
      - href: SETUP_GUIDE.md
        text: Setup
      - href: 00_Workshop_Roadmap.ipynb
        text: Roadmap
    right:
      - icon: github
        href: https://github.com/thiasyoung/2026-avs-ml-vibe-coding-workshop
        text: Notebooks on GitHub
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
      - section: Getting started
        contents:
          - href: SETUP_GUIDE.md
            text: Install and set up
          - href: 00_Workshop_Roadmap.ipynb
            text: Workshop roadmap
          - href: 00_Test_Installation.ipynb
            text: Check your installation
          - href: 00_Ten_Steps_in_Prompts.ipynb
            text: Optional generic template (bring your data)
      - section: "01 · Boiling point"
        href: 01_boiling_point/README.md
        contents:
          - href: 01_boiling_point/00_BP_Get_Data_NISTChemPy_v2.ipynb
            text: "00 · Get data (pre-work)"
          - href: 01_boiling_point/01_Ten_Steps_in_Prompts.ipynb
            text: "01 · Ten-step template"
          - href: 01_boiling_point/02_BP_Vibe_Coding_Workbook.ipynb
            text: "02 · Vibe-coding workbook"
          - section: Examples (optional)
            href: 01_boiling_point/examples/README.md
            contents:
              - href: 01_boiling_point/examples/reference_models/01_BP_Chemprop_GNN.ipynb
                text: "Reference · Chemprop GNN"
              - href: 01_boiling_point/examples/reference_models/02_BP_Foundation_Model.ipynb
                text: "Reference · Frozen MoLFormer"
              - section: Prompt iteration
                href: 01_boiling_point/examples/prompt_iteration/README.md
                contents:
                  - href: 01_boiling_point/examples/prompt_iteration/Compare_Prompt_Strategies.ipynb
                    text: "Compare prompt strategies"
                  - href: 01_boiling_point/examples/prompt_iteration/notebooks/P0_BP_Zero_Shot.ipynb
                    text: "P0 · Zero-shot"
                  - href: 01_boiling_point/examples/prompt_iteration/notebooks/P1_BP_One_Shot.ipynb
                    text: "P1 · One-shot"
                  - href: 01_boiling_point/examples/prompt_iteration/notebooks/P2_BP_One_Shot.ipynb
                    text: "P2 · Self-consistency"
                  - href: 01_boiling_point/examples/prompt_iteration/notebooks/P3_BP_One_Shot.ipynb
                    text: "P3 · VIBE-structured"
      - section: "02 · IR functional groups"
