  page-footer:
    left: "Reading view of the workshop notebooks · Saved outputs, not live computation"
    right:
      - text: Download the repository
        href: https://github.com/thiasyoung/2026-avs-ml-vibe-coding-workshop/archive/refs/heads/main.zip

# Never execute acquisition, training, shell commands, or practice cells when publishing.
execute:
  enabled: false
  echo: true
  output: true

format:
  html:
    theme: cosmo
    css: site/styles.css
    toc: true
    toc-depth: 2
    code-fold: true
    code-summary: Show Python code
    code-tools: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
