[project]
name = "avs-vibe-coding-workshop"
version = "0.1.0"
description = "Local Jupyter notebooks and data for the AVS vibe-coding workshop"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.3",
    "chemprop==2.2.1",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.9",
    "iterative-stratification==0.1.9",
    "jcamp==1.2.2",
    "jupyterlab==4.3.4",
    "matplotlib==3.10.0",
    "nistchempy==2.0.0",
    "numpy==2.0.0",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "rdkit==2024.3.6",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "tensorboard==2.21.0",
    "torch==2.5.1",
    "tqdm==4.67.1",
    "transformers==5.17.0",
]

[tool.uv]
package = false
# Copying avoids hard-link failures when a participant stores the repository in OneDrive.
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
